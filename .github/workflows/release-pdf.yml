name: Build & Release PDF

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended \
                                  texlive-latex-extra latexmk graphviz

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PDF
        run: make pdf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/latex/Odoo-CEFIRE.pdf